name: Compilar tarjeta del pivote
on:
  push:
    paths: ["servimaxx-pivote/tarjeta_pivote_4g/**", ".github/workflows/firmware-pivote.yml"]
  workflow_dispatch:
jobs:
  compilar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["2.0.17", "3.0.7"]
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
              version: ${{ matrix.version }}
          libraries: |
            - name: TinyGSM
          sketch-paths: servimaxx-pivote/tarjeta_pivote_4g
          enable-deltas-report: false
