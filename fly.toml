# Alternativa a Render: Fly.io tiene región en Santiago (scl).
# fly launch --no-deploy --copy-config ; fly volumes create datos --region scl --size 1 ; fly secrets set ... ; fly deploy
app = "monitor-avicola"
primary_region = "scl"

[build]

[env]
  MODO_PRUEBA = "true"
  ZONA_HORARIA = "America/Santiago"
  GALPONES = "Galpón 1,Galpón 2,Galpón 3,Galpón 4"
  CALOR_AVISO = "28"
  CALOR_CRITICO = "31"
  FRIO = "14"
  HUMEDAD_ALTA = "80"
  HUMEDAD_MINUTOS = "30"
  SIN_DATOS_MINUTOS = "20"
  LLAMADAS_PROVEEDOR = "callmebot"

[mounts]
  source = "datos"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Tiene que estar siempre encendido para detectar que la granja dejó de enviar datos.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/salud"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
