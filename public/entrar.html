<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entrar · Monitor de galpones</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Galpones">
<meta name="theme-color" content="#8a5a1c">
<style>
:root{--bg:#f4f3ef;--surface:#fff;--ink:#22231f;--muted:#6b6c63;--line:#dedcd3;--crit:#b8321f;--accent:#8a5a1c;--f:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#171714;--surface:#21211d;--ink:#ecebe4;--muted:#a3a296;--line:#36362f;--crit:#f2836f;--accent:#d9a45c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);padding:16px}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px}
img{width:64px;height:64px;border-radius:14px;align-self:center}
h1{margin:0;font-size:1.3rem;text-align:center}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
button{font:600 16px var(--f);background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px;cursor:pointer}
.err{color:var(--crit);font-size:14px;text-align:center;margin:0}
</style>
</head>
<body>
<form method="post" action="entrar">
  <img src="icono-180.png" alt="">
  <h1>Monitor de galpones</h1>
  <!--ERROR-->
  <label>Usuario<input name="usuario" autocomplete="username" autocapitalize="none" required></label>
  <label>Clave<input name="clave" type="password" autocomplete="current-password" required></label>
  <button>Entrar</button>
</form>
</body>
</html>
